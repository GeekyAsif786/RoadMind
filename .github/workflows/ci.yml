name: CI

# Runs the three "Verification Commands" documented in README.md on every
# push and pull request:
#   1. Backend syntax check (py_compile of the six listed modules)
#   2. Frontend build check (npm --prefix frontend run build)
#   3. Backend tests (pip install -r requirements.txt && pytest)

on:
  push:
  pull_request:

jobs:
  backend-syntax:
    name: Backend syntax check (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Command 1 from README.md "Verification Commands".
      - name: python -m py_compile (six modules)
        working-directory: backend
        run: |
          python -m py_compile app/core/config.py app/services/density_service.py app/services/optimization_service.py app/services/traffic_service.py app/models/domain.py app/schemas/dto.py

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Frontend tests
        run: npm --prefix frontend test
      # Command 2 from README.md "Verification Commands".
      - name: npm --prefix frontend run build
        run: npm --prefix frontend run build

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    # Database-backed tests need a real PostgreSQL with the Alembic schema.
    # Redis is not provisioned: Redis-path tests use in-process fakes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traffic_manager
          POSTGRES_USER: traffic
          POSTGRES_PASSWORD: traffic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traffic -d traffic_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://traffic:traffic@localhost:5432/traffic_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      # Command 3 from README.md "Verification Commands".
      - name: pytest
        working-directory: backend
        run: pytest
