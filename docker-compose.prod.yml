services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes

  # IMPORTANT: API_KEY and CORS_ORIGINS must be supplied via .env or a secret
  # manager. They are intentionally NOT defaulted in this file. If left unset,
  # the backend would inherit the development API key and HTTP localhost CORS
  # origins from docker-compose.yml; the app refuses to start in production
  # with either (see app/core/config.py).
  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      ENABLE_AUTH: "true"
      SESSION_COOKIE_SECURE: "true"
      CACHE_ENABLED: "true"
      JOB_QUEUE_ENABLED: "true"
      API_KEY: "${API_KEY:?API_KEY must be set for production (via .env or secret)}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set for production to HTTPS origins (via .env or secret)}"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  # The worker loads app settings when it runs a job, so it must satisfy the
  # same production guard as the backend.
  worker:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      ENABLE_AUTH: "true"
      SESSION_COOKIE_SECURE: "true"
      JOB_QUEUE_ENABLED: "true"
      API_KEY: "${API_KEY:?API_KEY must be set for production (via .env or secret)}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS must be set for production to HTTPS origins (via .env or secret)}"

  pgadmin:
    profiles: ["debug"]
